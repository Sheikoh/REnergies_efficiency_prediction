name: Export Draw.io Diagrams

on:
  push:
    # Trigger only when this specific file changes
    paths:
      - 'diagrams/architecture.drawio'
    branches:
      - main

jobs:
  export:
    # Prevent infinite loop: skip if commit was made by GitHub Actions itself
    if: github.actor != 'github-actions'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # full history required

      - name: Export .drawio to .svg
        uses: rlespinasse/drawio-export-action@v2
        with:
          path: diagrams/architecture.drawio   # input file
          format: svg                          # output format
      
      - name: Debug export output
        run: ls -R diagrams

      - name: Move exported file
        run: |
          mv diagrams/export/architecture.svg diagrams/architecture.svg
          rm -rf diagrams/export

      - name: Commit and push SVG
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add diagrams/architecture.svg || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-export updated diagram architecture.drawio to .svg"
            git push
          fi